# Model hosting for the UAV Stream Analysis System.
#   docker compose --profile vllm up -d vllm     # Qwen3-VL via vLLM (OpenAI API :8080) — primary
#   docker compose --profile debug up -d perception-api  # SAM 3 + DINOv3 (:8090)
#   docker compose up -d vlm                     # optional: Gemma 4 12B standby via llama.cpp
#
# Active model/config comes from the profile you copy to .env (see profiles/).
name: uav-model-servers

services:
  # ---- Optional standby VLM: llama.cpp server, GGUF + mmproj (Gemma 4 12B) --
  vlm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m ${VLM_MODEL}
      --mmproj ${VLM_MMPROJ}
      --host 0.0.0.0 --port 8080
      -ngl ${VLM_NGL} -c ${VLM_CTX} --parallel ${VLM_PARALLEL}
      --flash-attn --alias uav-vlm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- SAM 3 + DINOv3 API (stand-in until backend/ imports them in-process;
  # see README §1.3 — that in-process design is still the eventual target) ----
  perception-api:
    profiles: ["debug"]
    build: ./perception
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models:ro
      - ./perception/concepts:/app/concepts   # concept packs — read/written by tools/*.py, persists on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- Primary VLM: Qwen3-VL via vLLM (HF-format, not GGUF) -------------------
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # WSL2 Docker Desktop: vLLM's V1 engine hard-requires pinned/UVA memory
      # and crashes ("UVA is not available") without this — pinned memory is
      # supported on WSL2 kernels >=4.19.121 but off by default. See
      # vllm/platforms/cuda.py CudaPlatform.is_pin_memory_available().
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    ipc: host   # vLLM's own recommended Docker setting — shared memory for tensor IPC
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: >
      --model ${VLLM_MODEL}
      --port 8080 --served-model-name uav-vlm
      --gpu-memory-utilization 0.85 --max-model-len ${VLM_CTX}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
